name: CI

# Build the engine and run the full test suite on every push and pull request.
# Until this existed there was nothing gating regressions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build + test (Windows, Debug)
    runs-on: windows-latest

    env:
      BUILD_DIR: build/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lavapipe is Mesa's software Vulkan implementation. Installing it means
      # the headless GPU tests actually execute on a runner with no GPU instead
      # of reporting SKIPPED, so the RHI/rendering suites get real coverage.
      # The SDK is left unpinned to track the latest release; pin
      # `vulkan_version` if reproducible SDK versions matter more than freshness.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true
          install_lavapipe: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B $env:BUILD_DIR -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNF_USE_VULKAN=ON
          -DNF_BUILD_TESTS=ON
          -DNF_BUILD_SAMPLES=ON
          -DNF_BUILD_EDITOR=ON
          -DNF_BUILD_TOOLS=ON

      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR

      # The layering invariants Phase 11 established. A grep guard, run right after
      # the build so a reintroduced inversion fails in seconds with the offending
      # line named, instead of surfacing as a confusing link error much later.
      - name: Check layering invariants
        shell: bash
        run: bash Scripts/check_layering.sh

      # Point the Vulkan loader at Lavapipe so a device is available headlessly.
      # Non-fatal: without it the GPU suites degrade to SKIPPED, which the test
      # runner reports honestly rather than as a pass.
      - name: Select Lavapipe as the Vulkan device
        shell: pwsh
        continue-on-error: true
        run: |
          $icd = Get-ChildItem -Path C:\lavapipe -Recurse -Filter 'lvp_icd*.json' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($icd) {
            "VK_ICD_FILENAMES=$($icd.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            Write-Host "Using Vulkan ICD: $($icd.FullName)"
          } else {
            Write-Host "Lavapipe ICD not found; GPU tests will report SKIPPED."
          }

      - name: Run test suites
        shell: bash
        run: |
          set -o pipefail
          bash Scripts/run_tests.sh "$BUILD_DIR" | tee test_suites.log
          code=${PIPESTATUS[0]}
          # run_tests.sh exits 0 when nothing FAILED — including when a suite was
          # never built, or every GPU test was SKIPPED. A green build that
          # exercised nothing is not a green build, so every suite is asserted to
          # have actually executed.
          #
          # This is a loop over the suite list, not one hand-written block per
          # suite. The blocks it replaces had to be added one phase at a time,
          # which meant a suite could be added without a guard and nothing would
          # notice — and "a subsystem nobody steps" (Phase 9) is exactly the class
          # of defect that costs. A loop cannot drift from the runner's own list.
          require_suite() {
            local suite="$1" why="$2" n
            n=$(sed -n "s/^PASS  ${suite} .*Passed: \([0-9]*\).*/\1/p" test_suites.log | tail -1)
            echo "${suite} passed: ${n:-0}"
            if [ "${n:-0}" -eq 0 ]; then
              echo "No ${suite} executed — ${why}"
              exit 1
            fi
          }

          # A suite that failed to build never reaches the count above: run_tests.sh
          # reports it as SKIP and leaves it out of the totals entirely, so the
          # per-suite assertion below cannot see it.
          if grep -qE '^SKIP .*\(not built\)' test_suites.log; then
            echo "A suite did not build:"
            grep -E '^SKIP .*\(not built\)' test_suites.log
            exit 1
          fi

          require_suite CoreTests      "the core suite (math, memory, containers, IO) is missing or broken."
          require_suite JobTests       "the job-system suite is missing or broken."
          require_suite ECSTests       "the ECS suite — which carries the Phase 11 W4 benchmark ceilings — is missing or broken."
          require_suite AssetTests     "the asset suite — Phase 11 W1 made Assets CPU-pure and unified the mesh format — is missing or broken."
          require_suite RHITests       "Lavapipe is probably missing — GPU coverage was not verified."
          require_suite PhysicsTests   "the physics suite is missing or broken."
          require_suite AnimationTests "the animation suite is missing or broken."
          require_suite AudioTests     "the audio suite is missing or broken."
          require_suite GameplayTests  "the gameplay suite is missing or broken."
          require_suite SaveTests      "the save suite is missing or broken."
          require_suite StreamingTests "the streaming suite — Phase 11 W5, and the only thing asserting a boundary does not thrash — is missing or broken."
          require_suite RuntimeTests   "the runtime suite — the only one that catches Runtime::update() no longer stepping a subsystem — is missing or broken."
          require_suite EditorTests    "the editor suite is missing or broken."
          require_suite ToolTests      "the tool suite is missing or broken."

          # The reflection tests are the only guard against a property table that
          # points at the wrong offset — a defect that compiles, links and
          # silently corrupts data. They live in CoreTests (the reflection module
          # is in NFCore), and the runner only prints per-suite totals, so run the
          # name filter directly and require a non-zero pass count.
          reflection_out=$("$BUILD_DIR/bin/CoreTests.exe" reflection 2>&1 || true)
          reflection_passed=$(printf '%s\n' "$reflection_out" | sed -n 's/.*Passed: \([0-9]*\).*/\1/p' | tail -1)
          echo "Reflection tests passed: ${reflection_passed:-0}"
          if [ "${reflection_passed:-0}" -eq 0 ]; then
            echo "No reflection tests executed — the reflection suite is missing or broken."
            exit 1
          fi
          exit "$code"

      # The registry maps meshes to cache:// paths that only exist after cooking.
      # Without this the editor renders an empty scene, and the acceptance below
      # now asserts that geometry was actually drawn, so it would (correctly)
      # fail. Cooking is a prerequisite of running, not an optional extra.
      - name: Cook assets
        shell: bash
        run: |
          exe="$BUILD_DIR/bin/NFAssetCooker.exe"
          [ -f "$exe" ] || exe="$BUILD_DIR/bin/NFAssetCooker"
          if [ ! -f "$exe" ]; then echo "Asset cooker not built (needs -DNF_BUILD_TOOLS=ON)"; exit 1; fi
          "$exe" --input content://Meshes/cube.nfmesh \
                 --output cache://Meshes/cube.nfmesh \
                 --registry content://AssetRegistry.nfreg
          ls -l Cache/Meshes/

      # The editor acceptance harness, run headless so it works on a runner with
      # no display. It exercises the real workflows (outliner, inspector, undo,
      # play/stop, save round-trip, import + hot reload, prefabs, GPU picking)
      # and fails the build on any FAILED line, a validation error, or a leaked
      # RHI object. The harness waits for async imports rather than assuming
      # frame timing, which is what makes the frame-counted script survive a
      # machine that runs frames far faster than a vsync'd desktop.
      - name: Editor acceptance (headless)
        shell: bash
        run: |
          set -o pipefail
          exe="$BUILD_DIR/bin/NOVAForgeEditor.exe"
          [ -f "$exe" ] || exe="$BUILD_DIR/bin/NOVAForgeEditor"
          if [ ! -f "$exe" ]; then echo "Editor not built"; exit 1; fi
          "$exe" --scene content://Scenes/Example.nfscene --frames 120 --validation --headless \
            > editor_acceptance.log 2>&1
          code=$?
          echo "--- automation summary ---"
          grep -E 'Automation:' editor_acceptance.log | tail -12
          grep -E 'Validation errors|Alive RHI' editor_acceptance.log || true
          failed=$(grep -c 'Automation:.*FAILED' editor_acceptance.log || true)
          vkerr=$(grep -c 'ERROR \[RHI\]' editor_acceptance.log || true)
          if [ "$code" -ne 0 ]; then echo "Acceptance exited $code"; exit 1; fi
          if [ "$failed" -ne 0 ]; then
            echo "$failed automation step(s) failed:"
            grep 'Automation:.*FAILED' editor_acceptance.log
            exit 1
          fi
          if [ "$vkerr" -ne 0 ]; then echo "$vkerr Vulkan validation error(s)"; exit 1; fi
          if ! grep -q 'Alive RHI objects before shutdown: 0' editor_acceptance.log; then
            echo "RHI objects leaked"; exit 1
          fi

      # The triangle sample is the v0.1 milestone artifact. Rendering it with
      # the validation layer on and asserting zero errors is what makes the
      # "validation clean" claim meaningful.
      - name: Triangle sample smoke test (validation on)
        shell: bash
        env:
          NF_TRIANGLE_FRAMES: "60"
          NF_TRIANGLE_VALIDATION: "1"
        run: |
          set -o pipefail
          exe="$BUILD_DIR/bin/NFSampleTriangle.exe"
          [ -f "$exe" ] || exe="$BUILD_DIR/bin/NFSampleTriangle"
          if [ ! -f "$exe" ]; then
            echo "Triangle sample not built"; exit 1
          fi
          "$exe" > triangle.log 2>&1
          code=$?
          echo "--- sample output (tail) ---"
          tail -20 triangle.log
          errors=$(grep -c 'ERROR \[RHI\]' triangle.log || true)
          echo "Vulkan validation errors: $errors"
          if [ "$code" -ne 0 ]; then echo "Sample exited $code"; exit 1; fi
          if [ "$errors" -ne 0 ]; then
            echo "Validation is not clean"; grep 'ERROR \[RHI\]' triangle.log | head -10; exit 1
          fi

      # The design document's §262 chain, end to end: create a project, build it,
      # and run it as a standalone program. This is the Phase 7 acceptance, and
      # the only check that proves the whole path works outside the editor.
      #
      # The build tree's Shaders/ directory is moved aside before the player runs,
      # so the hardcoded `build/<cfg>/Shaders/Basic3D` search cannot be what makes
      # it work. If the package is not genuinely self-contained, this fails.
      - name: End-to-end — create, build, run a project
        shell: bash
        run: |
          set -uo pipefail
          # $BUILD_DIR is relative; this step cds into the package, so resolve it
          # to an absolute path first or every later reference breaks.
          BUILD_ABS="$(cd "$BUILD_DIR" && pwd)"
          NF="$BUILD_ABS/bin/nf.exe";           [ -f "$NF" ] || NF="$BUILD_ABS/bin/nf"
          PLAYER="$BUILD_ABS/bin/NFPlayer.exe"; [ -f "$PLAYER" ] || PLAYER="$BUILD_ABS/bin/NFPlayer"
          if [ ! -f "$NF" ];     then echo "nf not built (needs -DNF_BUILD_TOOLS=ON)"; exit 1; fi
          if [ ! -f "$PLAYER" ]; then echo "NFPlayer not built"; exit 1; fi

          DEMO="$RUNNER_TEMP/NfCiDemo"
          rm -rf "$DEMO"
          "$NF" new "$DEMO" --name CiDemo    || exit 1
          "$NF" build --project "$DEMO/CiDemo.nfproj" || exit 1
          "$NF" verify --project "$DEMO/CiDemo.nfproj" || exit 1

          for f in manifest.txt Cache/Meshes/cube.nfmesh Shaders/Basic3D/gbuffer_vert.spv CiDemo.nfproj; do
            if [ ! -f "$DEMO/dist/$f" ]; then echo "package is missing $f"; exit 1; fi
          done

          # Hide the engine's compiled shaders: the package must carry its own.
          mv "$BUILD_ABS/Shaders" "$BUILD_ABS/Shaders.hidden"

          # Run the player that SHIPPED IN THE PACKAGE, from inside the package,
          # with no --project argument. The build tree's player would find its
          # project beside itself, which is not what a shipped game does.
          cd "$DEMO/dist"
          "./$(basename "$PLAYER")" --frames 60 --validation > player.log 2>&1
          code=$?
          mv "$BUILD_ABS/Shaders.hidden" "$BUILD_ABS/Shaders"
          tail -20 player.log

          if [ "$code" -ne 0 ]; then echo "player exited $code"; exit 1; fi
          if ! grep -q 'Rendered 60 frames' player.log; then echo "did not render"; exit 1; fi
          if grep -q 'meshes=0' player.log; then echo "rendered no geometry"; exit 1; fi
          if ! grep -q 'Validation errors: 0' player.log; then echo "validation not clean"; exit 1; fi
          if ! grep -q 'Alive RHI objects before shutdown: 0' player.log; then echo "leaked RHI objects"; exit 1; fi
          # Phase 8: the template scene has physics entities (a falling box on
          # a static plane). The runtime must create the physics world and
          # register both bodies. Without this line the physics system is dead
          # code that no CI step touches.
          if ! grep -q 'physics world created' player.log; then echo "physics world not created"; exit 1; fi
          # Phase 9: the template scene also carries an entity driven by a
          # procedural animation clip and a generated audio tone. The physics
          # assertion above would still pass if Runtime::update() stopped
          # calling step_animation()/step_audio(), because the falling box is
          # driven by physics alone — so assert the animated transform actually
          # moved and the mixer actually produced signal.
          anim_line=$(grep 'Animated entities:' player.log | tail -1)
          echo "$anim_line"
          if ! printf '%s' "$anim_line" | grep -q 'Animated entities: 1'; then
            echo "animated entity not registered"; exit 1
          fi
          if printf '%s' "$anim_line" | grep -qE 'deviation over [0-9]+ frames: 0(\.0*)?\)'; then
            echo "animated entity never moved — animation is not being stepped"; exit 1
          fi
          audio_line=$(grep 'Audio sources mixed' player.log | tail -1)
          echo "$audio_line"
          if ! printf '%s' "$audio_line" | grep -q 'Audio sources mixed (peak): 1'; then
            echo "no audio source was mixed"; exit 1
          fi
          if printf '%s' "$audio_line" | grep -qE '\(0(\.0*)?\)$'; then
            echo "audio mixed to silence — audio is not being stepped"; exit 1
          fi
          echo "End-to-end OK: project created, built, packaged and run standalone with physics, animation and audio."
