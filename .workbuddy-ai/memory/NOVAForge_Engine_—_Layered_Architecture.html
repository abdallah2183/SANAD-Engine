<svg viewBox="0 0 680 760" width="100%" role="img">
  <title>NOVAForge Engine layered architecture</title>
  <desc>Top-down view of the NOVAForge Engine architecture from editor down to OS/hardware level</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    </marker>
  </defs>

  <!-- Editor Layer -->
  <g>
    <rect x="40" y="30" width="600" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="54" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">NOVAForge Editor</text>
    <text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#7F77DD">Tools · UI · Inspectors · Viewport · Gizmos · Plugins</text>
  </g>

  <!-- Arrow down -->
  <line x1="340" y1="94" x2="340" y2="116" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1D9E75">C++ · C#/Lua · Visual Scripting · Reflection</text>
  </g>

  <line x1="340" y1="174" x2="340" y2="196" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>

    <text x="436" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Animation</text>

    <rect x="496" y="236" width="100" height="48" rx="6" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
    <text x="546" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">AI</text>

    <rect x="56" y="290" width="100" height="4" rx="2" fill="none"/>
  </g>

  <line x1="340" y1="298" x2="340" y2="320" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="322" width="600" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>

  </g>

    <rect x="40" y="402" width="600" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>

  </g>

  <line x1="340" y1="538" x2="340" y2="560" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="340" y="604" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#888780">Windows · Linux · macOS · Android · iOS</text>
  </g>

  </g>

  <g>
    <rect x="247" y="650" width="186" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="672" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">World Streaming</text>
    <text x="340" y="690" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1D9E75">Player pos → Predict</text>
    <text x="340" y="704" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1D9E75">→ Async IO → Load</text>
    <text x="340" y="718" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1D9E75">→ GPU upload → Activate</text>
  </g>

  <g>
    <rect x="454" y="650" width="186" height="80" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="547" y="672" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">Build &amp; CI</text>
    <text x="547" y="690" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#BA7517">CMake · Ninja · nf CLI</text>
    <text x="547" y="704" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#BA7517">Cook · Package · Ship</text>
    <text x="547" y="718" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#BA7517">Server build (no GPU)</text>
  </g>
